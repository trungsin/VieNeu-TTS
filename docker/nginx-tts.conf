map $http_upgrade $tts_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name tts.datxanhmientrung.ai;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tts_mcp_origin http://mcp:8010;
    set $tts_web_origin http://cpu:7860;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /mcp {
        client_max_body_size 256k;
        proxy_buffering off;
        proxy_pass $tts_mcp_origin;
    }

    location ^~ /audio/ {
        access_log off;
        proxy_pass $tts_mcp_origin;
    }

    location / {
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tts_connection_upgrade;
        proxy_pass $tts_web_origin;
    }
}
