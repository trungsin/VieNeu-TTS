# Cloudflare Tunnel deployment overlay for the CPU Web UI.
# Run from the repository root with:
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.cloudflare.yml --profile cpu up -d --build cpu mcp proxy cloudflared
services:
  cpu:
    restart: unless-stopped
    environment:
      - VIENEU_HOME=/home/app/.vieneu
    ports: !override
      - "127.0.0.1:17860:7860"
    volumes: !override
      - ${HF_CACHE_PATH:-/home/leesun/.cache/huggingface}:/home/app/.cache/huggingface
      - ./output_audio:/workspace/output_audio
      - ../data/vieneu:/home/app/.vieneu

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
      args:
        ENABLE_MCP: "1"
    image: vieneu-tts-mcp:local
    container_name: vieneu-tts-mcp
    profiles: ["cpu"]
    restart: unless-stopped
    command: ["python", "-m", "apps.mcp_server"]
    environment:
      VIENEU_MCP_TRANSPORT: streamable-http
      VIENEU_MCP_HOST: 0.0.0.0
      VIENEU_MCP_PORT: "8010"
      VIENEU_MCP_PUBLIC_URL: https://tts.datxanhmientrung.ai
      VIENEU_MCP_TOKEN_FILE: /run/secrets/mcp_token
      VIENEU_BACKEND: onnx
      VIENEU_PRECISION: fp32
      VIENEU_OUTPUT_DIR: /workspace/output_audio
      VIENEU_HOME: /home/app/.vieneu
    volumes:
      - ${HF_CACHE_PATH:-/home/leesun/.cache/huggingface}:/home/app/.cache/huggingface
      - ./output_audio:/workspace/output_audio
      - ../data/vieneu:/home/app/.vieneu
      - ./.mcp/token:/run/secrets/mcp_token:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.30.7-alpine
    container_name: vieneu-tts-proxy
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-7860}:8080"
    volumes:
      - ./nginx-tts.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cpu:
        condition: service_started
      mcp:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vieneu-tts-cloudflared
    user: "1000:1000"
    network_mode: host
    profiles: ["cpu"]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS:-./.cloudflared/vieneu-tts-linux.json}:/etc/cloudflared/credentials.json:ro
    depends_on:
      proxy:
        condition: service_started
